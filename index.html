<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acolyte Practice — Immaculate Conception · El Paso</title>
<meta name="theme-color" content="#1e4080">
<meta name="description" content="Acolyte training for Immaculate Conception Church · FSSP · El Paso — practice Latin responses, movements, and parish rubrics.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e4080'/%3E%3Cpath d='M16 7v18M11 11h10' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7;
    --surface:#fff;
    --surface-2:#f9fafb;
    --border:#e2e5ea;
    --text:#111827;
    --text-secondary:#374151;
    --text-muted:#6b7280;
    --primary:#1e4080;
    --primary-hover:#163366;
    --primary-soft:#eef2f9;
    --success:#047857;
    --warning:#b45309;
    --danger:#b91c1c;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-latin:"EB Garamond",Georgia,serif;
    --max:704px;
    --radius:8px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
    --page:var(--surface);
    --page-warm:var(--surface-2);
    --page-edge:var(--surface-2);
    --ink:var(--text);
    --ink-soft:var(--text-muted);
    --rubric:var(--primary);
    --rubric-soft:var(--primary-hover);
    --rubric-deep:var(--primary);
    --ic-blue:var(--primary);
    --ic-blue-light:#3568b8;
    --ic-white:var(--text);
    --border-soft:var(--border);
    --tint:var(--primary-soft);
    --gold:var(--text-muted);
    --gold-bright:var(--text-muted);
    --gold-pale:var(--primary-soft);
    --radius-sm:6px;
    --radius-md:var(--radius);
    --radius-lg:10px;
    --radius-pill:var(--radius);
    --font-display:var(--font);
    --font-body:var(--font);
    --shadow-lg:var(--shadow);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }

  .site-shell{min-height:100vh;display:flex;flex-direction:column;}
  .site-header{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 16px;}
  .site-header-inner,.app-main,.site-footer{max-width:var(--max);margin:0 auto;width:100%;}
  .app-main{flex:1;padding:24px 16px 32px;}
  .site-footer{padding:20px 16px 28px;font-size:13px;color:var(--text-muted);text-align:center;border-top:1px solid var(--border);background:var(--surface);}

  .site-eyebrow{margin:0 0 4px;font-size:13px;font-weight:500;color:var(--text-muted);}
  .brand h1{margin:0;font-size:1.375rem;font-weight:600;letter-spacing:-.02em;color:var(--text);}

  .missal-wrap{width:100%;margin:0 auto;}
  .ribbon{display:none;}
  .missal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:28px;}
  .missal-home{padding-top:28px;}

  .panel-header{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  .panel-header h2{margin:0 0 8px;font-size:1.125rem;font-weight:600;color:var(--text);}
  .panel-intro{margin:0;font-size:15px;color:var(--text-muted);line-height:1.55;}

  .meta-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:20px;}
  .step-count{font-size:12px;font-weight:500;color:var(--text-muted);}
  .section-label{font-size:13px;font-weight:600;color:var(--primary);text-align:right;line-height:1.35;}

  .block{margin-bottom:20px;}
  .role{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px;}
  .role .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;}
  .latin{font-family:var(--font-latin);font-size:1.3125rem;line-height:1.6;font-style:italic;color:var(--text);}
  .rubric-note,.translation{font-size:15px;color:var(--text-muted);line-height:1.55;}
  .translation{margin-top:8px;}
  .varies-tag,.info-tag{font-size:11px;font-weight:500;color:var(--text-muted);border:1px solid var(--border);border-radius:4px;padding:2px 8px;margin-left:8px;vertical-align:middle;background:var(--surface-2);}

  .hear-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .hear-btn,.mini-btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    color:var(--text-secondary);border-radius:var(--radius-sm);padding:8px 14px;font-family:var(--font);font-size:14px;cursor:pointer;font-weight:500;
  }
  .hear-btn:hover,.mini-btn:hover{background:var(--surface-2);border-color:var(--border-strong,#cdd2d9);}
  .hear-btn:focus-visible,.mini-btn:focus-visible,.begin-btn:focus-visible,.nav-btn:focus-visible,.mode-btn:focus-visible,.section-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  .mini-btn.rec-active{background:var(--danger);color:#fff;border-color:var(--danger);}
  .voice-note{font-size:13px;color:var(--text-muted);}

  .server-block{border-top:1px solid var(--border);padding-top:20px;margin-top:4px;}
  .reveal-wrap{position:relative;}
  .reveal-bar{height:3px;width:100%;background:var(--primary-soft);border-radius:2px;overflow:hidden;margin-bottom:12px;}
  .reveal-bar-fill{height:100%;background:var(--primary);width:100%;transform-origin:left;}
  @keyframes shrink{from{transform:scaleX(1);}to{transform:scaleX(0);}}
  .locked-msg{font-style:italic;color:var(--text-muted);font-size:15px;padding:12px 0 6px;text-align:center;}
  .fading{animation:fadeout .45s forwards;}
  @keyframes fadeout{to{opacity:0;height:0;margin:0;padding:0;}}

  .record-row{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .rec-btn{font-size:14px;font-weight:600;border:none;border-radius:var(--radius-sm);padding:10px 18px;cursor:pointer;color:#fff;background:var(--primary);display:inline-flex;align-items:center;gap:8px;}
  .rec-btn:hover:not(:disabled){background:var(--primary-hover);}
  .rec-btn:disabled{background:#d1d5db;cursor:not-allowed;color:#fff;}
  .rec-btn.recording{background:var(--danger);}
  .rec-dot{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block;}
  .timer{font-size:13px;color:var(--text-muted);min-width:44px;font-variant-numeric:tabular-nums;}
  audio{height:36px;max-width:240px;border-radius:var(--radius-sm);}
  .status-chip{font-size:12px;font-weight:500;color:var(--text-muted);}

  .compare-box{margin-top:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .compare-label{font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;}
  .compare-row{margin-bottom:10px;}
  .compare-latin{font-size:17px;}
  .compare-heard{font-size:15px;color:var(--text-muted);font-style:italic;}
  .w-ok{color:var(--success);}
  .w-miss{color:var(--primary);text-decoration:underline;text-decoration-color:rgba(30,64,128,.3);}
  .score-chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:4px;margin-top:4px;}
  .score-good{background:#ecfdf5;color:var(--success);}
  .score-mid{background:#fffbeb;color:var(--warning);}
  .score-low{background:#fef2f2;color:var(--danger);}
  .compare-note{margin-top:12px;font-size:13px;color:var(--text-muted);}

  .nav-row{display:flex;justify-content:space-between;align-items:center;max-width:var(--max);width:100%;margin:20px auto 0;gap:12px;}
  .nav-btn{font-size:14px;font-weight:500;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;}
  .nav-btn:hover:not(:disabled){background:var(--surface-2);}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed;}
  .progress-track{flex:1;height:4px;background:var(--border);border-radius:2px;max-width:220px;}
  .progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .25s;}

  .controls{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;max-width:var(--max);margin-left:auto;margin-right:auto;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);}
  .seg button{background:none;border:none;color:var(--text-muted);font-family:var(--font);font-size:13px;padding:8px 14px;cursor:pointer;font-weight:500;}
  .seg button.active{background:var(--primary);color:#fff;}
  .seg button:not(.active):hover{background:var(--surface-2);}
  .toggle-link{font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;}
  .toggle-link.active{color:var(--primary);border-color:var(--primary);background:var(--primary-soft);}

  .cover,.summary,.settings-view,.recordpriest-view,.rubric-view,.flash-view,.section-view,.learn-view{max-width:var(--max);width:100%;margin:0 auto;}
  .cover h2,.summary h2,.settings-view h2,.recordpriest-view h2,.rubric-view h2,.flash-view h2,.section-view h2,.learn-view h2,.panel-header h2{font-size:1.125rem;font-weight:600;color:var(--text);margin-top:0;}
  .cover p,.settings-view p{line-height:1.6;font-size:15px;color:var(--text-secondary);}

  .begin-btn{font-size:14px;font-weight:600;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);padding:11px 20px;cursor:pointer;margin-top:12px;}
  .begin-btn:hover{background:var(--primary-hover);}
  .begin-btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);}
  .begin-btn.ghost:hover{background:var(--surface-2);}
  .begin-btn.block{display:block;width:100%;text-align:center;}
  .utility-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}

  .summary-item{border-bottom:1px solid var(--border);padding:14px 0;}
  .summary-item:last-child{border-bottom:none;}
  .summary-item .sec{font-size:12px;font-weight:600;color:var(--text-muted);}
  .summary-item .lat{font-family:var(--font-latin);font-style:italic;margin:5px 0 10px;font-size:15px;}
  .restart-btn{margin-top:20px;width:100%;}

  .field-label{font-size:13px;font-weight:600;color:var(--text-secondary);display:block;margin:16px 0 8px;}
  .text-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:15px;background:var(--surface);}
  .text-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,128,.1);}
  select.text-input{cursor:pointer;}
  .settings-note{font-size:13px;color:var(--text-muted);margin-top:6px;}

  .rp-item{border-bottom:1px solid var(--border);padding:16px 0;}
  .rp-item .sec{font-size:12px;font-weight:600;color:var(--text-muted);}
  .rp-item .lat{font-family:var(--font-latin);font-style:italic;margin:5px 0 12px;font-size:15px;}
  .rp-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 4px;}
  .mode-btn{
    font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:14px 16px;cursor:pointer;text-align:left;line-height:1.4;
  }
  .mode-btn:hover{border-color:#b8bec7;background:var(--surface-2);}
  .mode-btn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);}
  .mode-btn span{display:block;font-size:13px;font-weight:400;color:var(--text-muted);margin-top:4px;}
  .mode-btn.active span{color:var(--text-secondary);}

  .home-tabs{display:flex;gap:4px;margin:20px 0;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .home-tabs button{
    flex:1;min-width:max-content;background:none;border:none;border-bottom:2px solid transparent;
    font-size:13px;font-weight:500;padding:10px 12px;cursor:pointer;color:var(--text-muted);white-space:nowrap;margin-bottom:-1px;
  }
  .home-tabs button:hover{color:var(--text);}
  .home-tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}

  .role-block{margin:12px 0 4px;}
  .role-block .field-label{margin-top:0;}

  .rubric-item{border-bottom:1px solid var(--border);padding:16px 0;}
  .rubric-item .sec{font-size:12px;font-weight:600;color:var(--text-muted);}
  .rubric-item .q{font-size:15px;margin:6px 0 4px;}
  .rubric-item .ans{font-size:14px;color:var(--primary);font-weight:500;}
  .rubric-item .exp{font-size:13px;color:var(--text-muted);margin-top:4px;}

  .flash-card{
    min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
    cursor:pointer;padding:28px 20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);margin:16px 0;
  }
  .flash-card .hint{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:12px;}
  .flash-card .main{font-family:var(--font-latin);font-size:1.25rem;line-height:1.5;}

  .flash-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;}
  .section-list{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
  .section-btn{font-size:15px;text-align:left;font-weight:500;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;color:var(--text);}
  .section-btn:hover{background:var(--surface-2);}

  .guide-item{border-bottom:1px solid var(--border);padding:16px 0;}
  .guide-item.guide-movement{background:var(--surface-2);margin:0 -8px;padding:14px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;}
  .guide-scroll{max-height:70vh;overflow-y:auto;padding-right:4px;}

  .glossary-row{border-bottom:1px solid var(--border);padding:12px 0;}
  .glossary-row .lat{font-family:var(--font-latin);font-size:17px;font-style:italic;}
  .glossary-row .eng{font-size:14px;color:var(--text-muted);}
  .glossary-row .when{font-size:12px;color:var(--text-muted);font-weight:500;margin-top:4px;}

  .bell-row{display:flex;gap:14px;border-bottom:1px solid var(--border);padding:12px 0;align-items:flex-start;}
  .bell-row .moment{flex:1;font-size:15px;}
  .bell-row .action{flex:1;font-size:14px;color:var(--primary);font-weight:500;}

  .check-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
  .check-row:hover{background:var(--surface-2);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:var(--radius-sm);}
  .check-row input{margin-top:4px;accent-color:var(--primary);width:16px;height:16px;cursor:pointer;}
  .check-row label{cursor:pointer;font-size:15px;flex:1;}
  .check-row.done label{color:var(--text-muted);text-decoration:line-through;}

  .stat-block{margin:12px 0;padding:16px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--border);}
  .stat-block .label{font-size:12px;font-weight:600;color:var(--text-muted);}
  .stat-block .value{font-size:1.5rem;color:var(--text);margin-top:4px;font-weight:600;}
  .stat-bar{height:6px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden;}
  .stat-bar-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s;}
  .weak-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:12px;}
  .weak-item .lat{font-family:var(--font-latin);font-size:14px;font-style:italic;flex:1;}

  .phonetic{font-size:14px;color:var(--text-muted);margin-top:6px;}
  .ref-block{margin:14px 0;}
  .ref-table{width:100%;border-collapse:collapse;font-size:14px;}
  .ref-table th,.ref-table td{border-bottom:1px solid var(--border);padding:8px;text-align:left;vertical-align:top;}
  .ref-table th{font-size:12px;font-weight:600;color:var(--text-muted);}
  .lesson-body{white-space:pre-wrap;font-size:15px;line-height:1.6;margin:12px 0;}
  .source-note{font-size:13px;color:var(--text-muted);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}

  .sched-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;background:var(--surface);}
  .sched-card.mine{border-color:var(--primary);background:var(--primary-soft);}
  .sched-card.trade-offer{border-color:var(--warning);}
  .sched-head{margin-bottom:8px;}
  .sched-date{font-size:14px;font-weight:600;color:var(--text);}
  .sched-meta{font-size:13px;color:var(--text-muted);margin-top:2px;}
  .slot-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--border);}
  .slot-row:first-of-type{border-top:none;}
  .slot-label{font-size:12px;font-weight:600;color:var(--text-muted);min-width:36px;}
  .slot-name{flex:1;font-size:15px;}
  .slot-open{color:var(--text-muted);font-style:italic;}
  .slot-trade{font-size:12px;color:var(--warning);font-weight:600;}
  .slot-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;}

  .profile-header{text-align:center;margin-bottom:20px;}
  .profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--primary);color:#fff;font-size:1.25rem;font-weight:600;margin:0 auto 12px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border);}
  .profile-avatar img{width:100%;height:100%;object-fit:cover;}
  .avatar-picker{display:block;cursor:pointer;margin:0 auto 8px;width:fit-content;}
  .avatar-picker input{display:none;}
  .avatar-hint{font-size:13px;color:var(--text-muted);display:block;margin-top:6px;}
  .admin-form{display:grid;gap:10px;margin-bottom:16px;padding:16px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--border);}
  .admin-form input,.admin-form select{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:15px;background:var(--surface);}
  .admin-form label{font-size:12px;font-weight:600;color:var(--text-muted);}
  .mini-btn.admin{background:var(--primary);color:#fff;border-color:var(--primary);}
  .points-badge{display:inline-block;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;margin-top:8px;}
  .sched-subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .sched-subtabs button{font-size:13px;font-weight:500;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;color:var(--text-muted);}
  .sched-subtabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  .mq-opt{border-radius:var(--radius-sm)!important;}

  @media (max-width:600px){
    .site-header{padding:16px 12px;}
    .app-main{padding:16px 12px 24px;}
    .missal,.cover .missal,.summary .missal,.settings-view .missal,.recordpriest-view .missal,.rubric-view .missal,.flash-view .missal,.section-view .missal,.learn-view .missal{padding:20px 16px;}
    .mode-grid{grid-template-columns:1fr;}
    .latin{font-size:1.125rem;}
    .meta-row{flex-direction:column;align-items:flex-start;gap:4px;}
    .section-label{text-align:left;}
    .brand h1{font-size:1.25rem;}
  }
</style>
</head>
<body>

<div class="site-shell">
<header class="site-header">
  <div class="site-header-inner">
    <div class="brand">
      <p class="site-eyebrow">Immaculate Conception Church · FSSP · El Paso, Texas</p>
      <h1>Acolyte Practice</h1>
    </div>
  </div>
</header>

<main id="app" class="app-main"></main>

<footer class="site-footer">
  Immaculate Conception Church · El Paso, TX · Extraordinary Form
</footer>
</div>

<script src="schedule-local.js"></script>
<script src="data/obrien-data.js"></script>
<script>
const app = document.getElementById('app');

function showBootError(title, detail){

}

}

function lsGet(key, fallback){
  try{ return localStorage.getItem(key) || fallback; }catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, val); }catch(e){}
}
function lsGetJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function lsSetJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

function loadProgress(){
  return lsGetJSON('altar_progress', {
    sessions: 0, lastSession: null, bestScores: {}, movementStats: {}, recordedOnce: {}
  });
}
function saveSessionProgress(){
  const p = loadProgress();
  p.sessions = (p.sessions || 0) + 1;
  p.lastSession = new Date().toISOString();
  Object.entries(state.transcripts).forEach(([idx, text])=>{
    if(!text) return;
    const s = STEPS[idx];
    const {score} = alignAndScore(s.server, text);
    const prev = p.bestScores[idx] || 0;
    if(score > prev) p.bestScores[idx] = score;
    p.recordedOnce[idx] = true;
  });
  Object.entries(state.movementResults).forEach(([id, ok])=>{
    if(!p.movementStats[id]) p.movementStats[id] = {correct:0, total:0};
    p.movementStats[id].total++;
    if(ok) p.movementStats[id].correct++;
  });
  lsSetJSON('altar_progress', p);
}

function stripAccents(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function getPhonetic(text){
  if(!text) return '';
  if(O_BRIEN_PHONETICS[text]) return O_BRIEN_PHONETICS[text];
  const plain = stripAccents(text);
  for(const [k,v] of Object.entries(O_BRIEN_PHONETICS)){
    if(stripAccents(k) === plain) return v;
  }
  return '';
}

function inSection(idx, range){
  return idx >= range.from && idx <= range.to;
}

function isServerResponseStep(idx){
  const s = STEPS[idx];
  return !s.priestOnly && !s.referenceOnly;
}

function stepInfoTag(s){
  if(s.priestOnly) return '<span class="info-tag">priest only</span>';
  if(s.referenceOnly) return '<span class="info-tag">reference only</span>';
  return '';
}

function buildSequence(role, mode='full', range=null){
  if(mode === 'movements'){
    return MOVEMENTS.filter(m=> m.role==='both' || m.role===role)
      .map(m=>({type:'movement', mq:m}));
  }
  if(mode === 'canon'){
    return MOVEMENTS.filter(m=>(m.role==='both'||m.role===role) && CANON_MV_IDS.includes(m.id))
      .sort((a,b)=> a.insertBefore - b.insertBefore || a.id.localeCompare(b.id))
      .map(m=>({type:'movement', mq:m}));
  }
  if(mode === 'responses'){
    return STEPS.map((_, idx)=> idx)
      .filter(idx=> (!range || inSection(idx, range)) && isServerResponseStep(idx))
      .map(idx=>({type:'prayer', idx}));
  }
  const seq = [];
  for(let idx=0; idx<=STEPS.length; idx++){
    MOVEMENTS.filter(m=> m.insertBefore===idx && (m.role==='both'||m.role===role))
      .filter(m=> !range || (m.insertBefore >= range.from && m.insertBefore <= range.to + 1))
      .forEach(m=> seq.push({type:'movement', mq:m}));
    if(idx < STEPS.length && (!range || inSection(idx, range)))
      seq.push({type:'prayer', idx});
  }
  return seq;
}

function startPractice(mode, range=null){
  state.practiceMode = mode;
  state.sectionRange = range;
  try{ localStorage.setItem('altar_practiceMode', mode); }catch(e){}
  state.movementResults = {};

  if(mode === 'section'){ state.view = 'sectionPick'; render(); return; }
  state.sequence = buildSequence(state.role, mode, range);
  state.view = 'practice';
  render();
}

function speakBrowser(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(stripAccents(text));
  let voice = availableVoices.find(v=>v.voiceURI === state.voiceURI);
  if(!voice) voice = availableVoices.find(v=>v.lang && v.lang.toLowerCase().startsWith('it')) || availableVoices.find(v=>v.default) || availableVoices[0];
  if(voice) u.voice = voice;
  u.rate = 0.82;
  u.pitch = 0.95;
  window.speechSynthesis.speak(u);
}

/* ============ ELEVENLABS TTS ============ */
async function speakEleven(text, i, statusEl){
  if(!state.elevenKey || !state.elevenVoiceId){
    if(statusEl) statusEl.textContent = 'Add your ElevenLabs API key & Voice ID in Voice Settings.';
    return;
  }
  if(state.elevenCache[i]){
    new Audio(state.elevenCache[i]).play();
    return;
  }
  if(statusEl) statusEl.textContent = 'Generating…';
  try{
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${state.elevenVoiceId}`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'xi-api-key': state.elevenKey, 'Accept':'audio/mpeg' },
      body: JSON.stringify({ text: text, model_id:'eleven_multilingual_v2', voice_settings:{stability:0.5, similarity_boost:0.75} })
    });
    if(!res.ok) throw new Error('ElevenLabs error ' + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    state.elevenCache[i] = url;
    if(statusEl) statusEl.textContent = '';
    new Audio(url).play();
  }catch(err){
    if(statusEl) statusEl.textContent = 'ElevenLabs request failed — check your key/voice ID.';
  }
}

function playPriestLine(i, statusEl){
  const s = STEPS[i];
  if(state.priestMode === 'custom'){

    else if(statusEl){ statusEl.textContent = 'No recording yet for this line — record it in "Record the Priest".'; }
  } else if(state.priestMode === 'eleven'){
    speakEleven(s.priest, i, statusEl);
  } else {
    speakBrowser(s.priest);
  }
}

/* ============ SPEECH-TO-TEXT SCORING (server's part) ============ */
function normToken(w){ return stripAccents(w).toLowerCase().replace(/[^a-z]/g,''); }
function alignAndScore(correctText, heardText){
  const correctTokens = correctText.replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean);
  const correctNorm = correctTokens.map(normToken);
  const heardNorm = heardText.split(/\s+/).filter(Boolean).map(normToken).filter(Boolean);
  const n = correctNorm.length, m = heardNorm.length;
  const dp = Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let a=1;a<=n;a++)for(let b=1;b<=m;b++){
    dp[a][b] = (correctNorm[a-1] && correctNorm[a-1]===heardNorm[b-1]) ? dp[a-1][b-1]+1 : Math.max(dp[a-1][b], dp[a][b-1]);
  }
  let a=n,b=m; const matched = new Array(n).fill(false);
  while(a>0 && b>0){
    if(correctNorm[a-1]===heardNorm[b-1]){ matched[a-1]=true; a--; b--; }
    else if(dp[a-1][b] >= dp[a][b-1]) a--;
    else b--;
  }
  const score = n ? Math.round((dp[n][m]/n)*100) : 0;
  const highlighted = correctTokens.map((tok,idx)=> matched[idx] ? `<span class="w-ok">${tok}</span>` : `<span class="w-miss">${tok}</span>`).join(' ');
  return {score, highlighted};
}
function renderComparison(i, transcript){
  const s = STEPS[i];
  const holder = document.getElementById('compareHolder');
  if(!holder) return;
  if(!transcript){
    holder.innerHTML = `<div class="compare-note">Speech recognition unavailable or heard nothing — recording saved, but no transcript to compare.</div>`;
    return;
  }
  const {score, highlighted} = alignAndScore(s.server, transcript);
  const cls = score>=85 ? 'score-good' : score>=55 ? 'score-mid' : 'score-low';
  holder.innerHTML = `
    <div class="compare-box">
      <div class="compare-row"><span class="compare-label">Correct (Latin)</span><div class="latin compare-latin">${highlighted}</div></div>
      <div class="compare-row"><span class="compare-label">You Said</span><div class="compare-heard">${transcript}</div></div>
      <div class="score-chip ${cls}">${score}% match</div>
    </div>`;
}

        cb.checked = !cb.checked;
        setChecklistItem(id, cb.checked);
        render();
      };
      row.querySelector('input').onchange = (e)=>{
        setChecklistItem(row.dataset.id, e.target.checked);
        render();
      };
    });
    document.getElementById('resetChecklistBtn').onclick = ()=>{
      lsSetJSON('altar_checklist', {});
      render();
    };
  } else {
    app.querySelectorAll('[data-practice-idx]').forEach(b=>{

        state.practiceMode = 'responses';

        state.view = 'practice';
        state.step = 0;
        render();
      };
    });
  }
  document.getElementById('settingsBtn').onclick = ()=>{ state.view='settings'; render(); };

}

let rpMediaRecorder, rpChunks=[], rpStream;
function renderRecordPriest(){
  app.innerHTML = `
    <div class="recordpriest-view"><div class="missal">
      <h2>Record the Priest</h2>
      <p style="font-size:15px;">Read each line aloud, in order — your voice will stand in for the priest during practice. This only matters if "My Recording" is selected in Voice Settings.</p>
      <div id="rpList"></div>
      <button class="begin-btn" id="rpDoneBtn" style="margin-top:14px;">Done — Back</button>
    </div></div>`;

  const list = document.getElementById('rpList');
  list.innerHTML = STEPS.map((s,idx)=>`
    <div class="rp-item" data-idx="${idx}">
      <div class="sec">${idx+1}. ${s.section}</div>
      <div class="lat">${s.priest}</div>
      <div class="rp-controls">
        <button class="mini-btn rp-rec-btn" data-idx="${idx}">🎙 Record</button>
        <span class="rp-playback"></span>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.rp-rec-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.dataset.idx);
      if(rpMediaRecorder && rpMediaRecorder.state === 'recording'){
        rpMediaRecorder.stop();
        return;
      }
      try{
        rpStream = await navigator.mediaDevices.getUserMedia({audio:true});
        rpChunks = [];
        rpMediaRecorder = new MediaRecorder(rpStream);
        rpMediaRecorder.ondataavailable = e=>rpChunks.push(e.data);
        rpMediaRecorder.onstop = ()=>{
          const blob = new Blob(rpChunks, {type: rpChunks[0]?.type || 'audio/webm'});
          const url = URL.createObjectURL(blob);
          state.priestRecordings[idx] = url;
          const item = list.querySelector(`.rp-item[data-idx="${idx}"] .rp-playback`);
          item.innerHTML = `<audio controls src="${url}"></audio>`;
          btn.textContent = '🎙 Re-record';
          btn.classList.remove('rec-active');
          rpStream.getTracks().forEach(t=>t.stop());
        };
        rpMediaRecorder.start();
        btn.textContent = '⏹ Stop';
        btn.classList.add('rec-active');
      }catch(err){
        alert('Microphone access denied.');
      }
    };
  });

  document.getElementById('rpDoneBtn').onclick = goHome;
}

  document.getElementById('settingsLink').onclick = ()=>{ state.view='settings'; render(); };
  app.querySelectorAll('.seg button').forEach(b=>{
    b.onclick = ()=>{ state.level = b.dataset.lvl; localStorage.setItem('altar_level', state.level); renderPrayerStep(); };
  });
  document.getElementById('hearBtn').onclick = ()=> playPriestLine(i, document.getElementById('hearStatus'));
  wireNav(seqPos);

  setupServerArea(i, s);
  setupRecorder(i);

  setTimeout(()=>playPriestLine(i, document.getElementById('hearStatus')), 250);
}

function renderMovementStep(){
  const seqPos = state.step;
  const mq = state.sequence[seqPos].mq;
  const total = state.sequence.length;
  const roleTag = mq.role==='both' ? 'Both Acolytes' : (mq.role==='ac1' ? 'Acolyte 1' : 'Acolyte 2');
  const prevAnswer = state.movementResults[mq.id];

  app.innerHTML = `
    <div class="controls">
      <button class="toggle-link" id="settingsLink">Voice</button>
    </div>
    <div class="missal-wrap">
      <div class="missal">
        <div class="meta-row">
          <span class="step-count">Step ${seqPos+1} of ${total}</span>
          <span class="section-label">${mq.section} · ${roleTag}</span>
        </div>
        <div class="block">
          <div class="role"><span class="dot"></span>Movements</div>
          <p style="font-size:17px; line-height:1.5; margin-top:0;">${mq.q}</p>
          <div id="mqOptions"></div>
          <div id="mqFeedback"></div>
        </div>
      </div>
    </div>
    ${navRow(seqPos)}
  `;

  const optHolder = document.getElementById('mqOptions');
  optHolder.innerHTML = mq.options.map((opt,idx)=>`<button class="mini-btn mq-opt" data-idx="${idx}" style="display:block; width:100%; text-align:left; margin-bottom:8px; padding:10px 14px;">${opt}</button>`).join('');

  function lockIn(idx){
    const correct = idx === mq.correct;
    state.movementResults[mq.id] = correct;
    optHolder.querySelectorAll('.mq-opt').forEach((btn,bi)=>{
      btn.disabled = true;
      if(bi === mq.correct) btn.style.background = 'rgba(47,107,47,.18)', btn.style.borderColor = '#2f6b2f';
      else if(bi === idx) btn.style.background = 'rgba(124,18,32,.12)', btn.style.borderColor = 'var(--rubric)';
    });
    document.getElementById('mqFeedback').innerHTML = `
      <div class="compare-box" style="margin-top:12px;">
        <div class="score-chip ${correct?'score-good':'score-low'}">${correct ? 'Correct' : 'Not quite'}</div>
        <div class="translation" style="margin-top:8px;">${mq.explain}</div>
      </div>`;
  }

  if(prevAnswer !== undefined){
    // already answered this session — show state immediately
    const chosenIdx = prevAnswer ? mq.correct : -1;
    optHolder.querySelectorAll('.mq-opt').forEach((btn,bi)=>{
      btn.disabled = true;
      if(bi === mq.correct) btn.style.background = 'rgba(47,107,47,.18)', btn.style.borderColor = '#2f6b2f';
    });
    document.getElementById('mqFeedback').innerHTML = `
      <div class="compare-box" style="margin-top:12px;">
        <div class="score-chip ${prevAnswer?'score-good':'score-low'}">${prevAnswer ? 'You answered this correctly' : 'Reviewed'}</div>
        <div class="translation" style="margin-top:8px;">${mq.explain}</div>
      </div>`;
  } else {
    optHolder.querySelectorAll('.mq-opt').forEach(btn=>{
      btn.onclick = ()=> lockIn(parseInt(btn.dataset.idx));
    });
  }

  document.getElementById('settingsLink').onclick = ()=>{ state.view='settings'; render(); };
  wireNav(seqPos);
}

function setupServerArea(i, s){
  const area = document.getElementById('serverArea');
  const recBtn = document.getElementById('recBtn');

  if(state.level === '1'){
    area.innerHTML = `
      <div class="reveal-wrap">
        <div class="reveal-bar"><div class="reveal-bar-fill" id="revealFill"></div></div>
        <div class="latin" id="revealText">${s.server}</div>
        ${getPhonetic(s.server) ? `<div class="phonetic">${getPhonetic(s.server)}</div>` : ''}
      </div>`;
    const fill = document.getElementById('revealFill');
    fill.style.animation = 'shrink 5s linear forwards';
    recBtn.disabled = true;
    setTimeout(()=>{
      const txt = document.getElementById('revealText');
      if(txt){ txt.classList.add('fading'); setTimeout(()=>{ if(txt) txt.style.display='none'; },450); }
      recBtn.disabled = false;
      document.getElementById('statusChip').textContent = 'Now record from memory';
    }, 5000);
  } else {
    area.innerHTML = `<div class="locked-msg">— text hidden · recall the response, then record —</div>`;
    recBtn.disabled = false;
  }
}

let mediaRecorder, chunks=[], recTimerInterval, recSeconds=0, currentStream;
let recognition, recognizedText='';
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

function setupRecorder(i){
  const recBtn = document.getElementById('recBtn');
  const recLabel = document.getElementById('recLabel');
  const timerEl = document.getElementById('timer');
  const playbackHolder = document.getElementById('playbackHolder');
  const statusChip = document.getElementById('statusChip');

  if(state.recordings[i]){
    playbackHolder.innerHTML = `<audio controls src="${state.recordings[i].url}"></audio>`;
    recLabel.textContent = 'Re-record';
    renderComparison(i, state.transcripts[i]);
  }

  recBtn.onclick = async ()=>{
    if(mediaRecorder && mediaRecorder.state === 'recording'){
      mediaRecorder.stop();
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      currentStream = stream;
      chunks = [];
      recognizedText = '';
      document.getElementById('compareHolder').innerHTML = '';
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = ()=>{
        const blob = new Blob(chunks, {type: chunks[0]?.type || 'audio/webm'});
        const url = URL.createObjectURL(blob);
        state.recordings[i] = {url, blob};
        playbackHolder.innerHTML = `<audio controls src="${url}"></audio>`;
        recBtn.classList.remove('recording');
        recLabel.textContent = 'Re-record';
        statusChip.textContent = 'Saved';
        clearInterval(recTimerInterval);
        timerEl.textContent = '';
        currentStream.getTracks().forEach(t=>t.stop());
        document.querySelectorAll('.dots span')[i]?.classList.add('done');
        const finalize = ()=>{
          state.transcripts[i] = recognizedText.trim();
          renderComparison(i, state.transcripts[i]);
        };
        if(recognition){
          let done = false;
          const finish = ()=>{ if(!done){ done=true; finalize(); } };
          recognition.onend = finish;
          try{ recognition.stop(); }catch(e){ finish(); }
          setTimeout(finish, 1200);
        } else {
          finalize();
        }
      };
      mediaRecorder.start();

      if(SpeechRec){
        recognition = new SpeechRec();
        recognition.lang = 'it-IT';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = (e)=>{
          for(let r= e.resultIndex; r < e.results.length; r++){
            if(e.results[r].isFinal) recognizedText += e.results[r][0].transcript + ' ';
          }
        };
        recognition.onerror = ()=>{};
        try{ recognition.start(); }catch(e){}
      }

      recBtn.classList.add('recording');
      recLabel.textContent = 'Stop';
      recSeconds = 0;
      timerEl.textContent = '0:00';
      recTimerInterval = setInterval(()=>{
        recSeconds++;
        const m = Math.floor(recSeconds/60), sec = String(recSeconds%60).padStart(2,'0');
        timerEl.textContent = `${m}:${sec}`;
      },1000);
    }catch(err){
      statusChip.textContent = 'Microphone access denied';
    }
  };
}

/* ============ SUMMARY ============ */
function renderSummary(){
  const isMovement = state.practiceMode==='movements' || state.practiceMode==='canon';
  const movementCount = Object.keys(state.movementResults).length;
  const correctCount = Object.values(state.movementResults).filter(Boolean).length;
  const recordedCount = Object.keys(state.recordings).length;

  if(isMovement){
    app.innerHTML = `
      <div class="summary"><div class="missal">
        <h2>Drill Complete</h2>
        <p>You answered ${movementCount} movement questions — ${correctCount} correct on first try.</p>
        ${state.sequence.filter(x=>x.type==='movement').map(item=>{
          const m = item.mq;
          const ok = state.movementResults[m.id];
          return `<div class="summary-item">
            <div class="sec">${m.section}</div>
            <div class="lat" style="font-style:normal;font-size:14px;">${m.q}</div>
            <div class="score-chip ${ok?'score-good':'score-mid'}" style="margin-top:6px;">${ok?'Correct':'Reviewed'}</div>
          </div>`;
        }).join('')}
        <button class="begin-btn restart-btn" id="restartBtn">Practice Again</button>
      </div></div>`;
  } else {
    const prayerItems = state.sequence.filter(x=> x.type==='prayer' && isServerResponseStep(x.idx));
    app.innerHTML = `
      <div class="summary"><div class="missal">
        <h2>Practice Complete</h2>
        <p>You recorded ${recordedCount} of ${prayerItems.length} responses.</p>
        ${prayerItems.map(item=>{
          const idx = item.idx;
          const s = STEPS[idx];
          return `<div class="summary-item">
            <div class="sec">${idx+1}. ${s.section}</div>
            <div class="lat">${s.server}</div>
            ${state.recordings[idx] ? `<audio controls src="${state.recordings[idx].url}"></audio>` : `<span style="color:var(--ink-soft); font-style:italic; font-size:14px;">— not recorded —</span>`}
            ${(state.recordings[idx] && state.transcripts[idx]) ? (()=>{ const r=alignAndScore(s.server, state.transcripts[idx]); const cls=r.score>=85?'score-good':r.score>=55?'score-mid':'score-low'; return `<div class="score-chip ${cls}" style="margin-top:8px;">${r.score}% match</div>`; })() : ''}
          </div>`;
        }).join('')}
        <button class="begin-btn restart-btn" id="restartBtn">Practice Again</button>
      </div></div>`;
  }
  saveSessionProgress();
  document.getElementById('restartBtn').onclick = ()=>{
    state.view='cover'; state.step=0;
    state.recordings={}; state.transcripts={};
    state.movementResults={};
    render();
  };
}

function render(){
  if(state.view === 'cover') renderHome();
  else if(state.view === 'settings') renderSettings();
  else if(state.view === 'recordPriest') renderRecordPriest();
  else if(state.view === 'summary') renderSummary();
  else if(state.view === 'rubric') renderRubricSheet();
  else if(state.view === 'massGuide') renderMassGuide();
  else if(state.view === 'glossary') renderGlossary();
  else if(state.view === 'bellChart') renderBellChart();
  else if(state.view === 'obrienLessons') renderObrienLessons();
  else if(state.view === 'obrienTwoServers') renderObrienTwoServers();
  else if(state.view === 'obrienSacristy') renderObrienSacristy();
  else if(state.view === 'obrienSanctuary') renderObrienSanctuary();
  else if(state.view === 'obrienVestments') renderObrienVestments();
  else if(state.view === 'obrienPostures') renderObrienPostures();
  else if(state.view === 'flashcards') renderFlashcards();
  else if(state.view === 'sectionPick') renderSectionPick();
  else renderPracticeItem();
}

async function boot(){
  try{
    app.innerHTML = '<div class="cover"><div class="missal"><h2>Acolyte Training</h2><p style="color:var(--ink-soft);">Loading…</p></div></div>';
    await initScheduleBackend();
    render();
  }catch(e){
    console.error('Boot failed:', e);
    showBootError('Something went wrong', (e && e.message) ? e.message : 'The app could not start. Try refreshing the page.');
  }
}
boot();
</script>
